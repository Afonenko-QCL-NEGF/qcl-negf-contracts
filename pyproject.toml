[project]
name = "qcl-negf-contracts"
version = "0.2.0"
description = "Versioned scientific schemas and pure boundary validation"
dependencies = []
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"

[project.urls]
Repository = "https://github.com/AfonenkoA/qcl-negf-contracts"
Issues = "https://github.com/AfonenkoA/qcl-negf-contracts/issues"

[project.optional-dependencies]
validation = ["jsonschema>=4.23,<5"]
test = ["pytest>=8.4,<10", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcl_negf_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
